name = "qagent-catalog"
main = "src/index.ts"
compatibility_date = "2026-08-14"
workers_dev = true

[vars]
ENVIRONMENT = "development"
SERVICE_NAME = "qagent-catalog"
FOUNDATION = "07.5.11"
REVISION = "catalog-query-v1-fix-1"
CATALOG_QUERY_MAX_SKEW_SECONDS = "300"

[secrets]
required = [ "CATALOG_QUERY_HMAC_SECRET" ]

[[d1_databases]]
binding = "CATALOG_DB"
database_name = "qagent-catalog-dev"
# Replace after: npx wrangler d1 create qagent-catalog-dev
database_id = "6db780dd-00cb-40e8-83b1-f493d3e07fbc"
migrations_dir = "migrations"


[[queues.consumers]]
queue = "qagent-catalog-updates-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1
dead_letter_queue = "qagent-catalog-updates-dlq-dev"

[triggers]
crons = [ "*/5 * * * *" ]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1